name: Release Pwnagotchi Plugins Bundle

on:
  push:
    branches:
      - main
      - rc
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: gallis-gh-runner

    permissions:
      contents: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install required utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip curl
        
        # Install GitHub CLI
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
        && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
        && sudo apt update \
        && sudo apt install gh -y
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_name }}" = "main" ]; then
          # For main branch, use consistent "latest" tag for easy downloading
          VERSION="latest"
        elif [ "${{ github.ref_name }}" = "rc" ]; then
          # For rc branch, use "latest-rc" tag
          VERSION="latest-rc"
        else
          # For tags
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"
        echo "Branch: ${{ github.ref_name }}"
        echo "Event: ${{ github.event_name }}"
    
    - name: Validate plugins directory
      run: |
        if [ ! -d "plugins" ]; then
          echo "Error: plugins directory not found"
          exit 1
        fi
        
        echo "Found plugins directory with the following files:"
        find plugins -name "*.py" -o -name "*.toml" -o -name "*.yml" -o -name "*.yaml" | head -20
        
        # Count plugin files
        PLUGIN_COUNT=$(find plugins -name "*.py" | wc -l)
        echo "Total Python plugins found: $PLUGIN_COUNT"
        
        if [ "$PLUGIN_COUNT" -eq 0 ]; then
          echo "Warning: No Python plugin files found"
        fi
    
    - name: Generate plugin metadata
      run: |
        mkdir -p build
        
        # Create plugin registry file
        cat > build/plugin_registry.json << 'EOF'
        {
          "repository": "pwnagotchi-plugins",
          "version": "${{ steps.version.outputs.VERSION }}",
          "branch": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "plugins": []
        }
        EOF
        
        # Extract plugin information
        python3 << 'PYTHON_SCRIPT'
        import os
        import re
        import json
        from pathlib import Path
        
        def extract_plugin_metadata(file_path):
            """Extract metadata from Python plugin file."""
            metadata = {
                'name': Path(file_path).stem,
                'file': os.path.basename(file_path),
                'version': '1.0.0',
                'author': 'Unknown',
                'license': 'GPL3',
                'description': 'No description available'
            }
            
            try:
                with open(file_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Extract class-level metadata
                patterns = {
                    'version': r'__version__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'author': r'__author__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'license': r'__license__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'description': r'__description__\s*=\s*[\'"]([^\'"]+)[\'"]'
                }
                
                for key, pattern in patterns.items():
                    match = re.search(pattern, content, re.MULTILINE)
                    if match:
                        metadata[key] = match.group(1)
                
                # Try to extract class name
                class_match = re.search(r'class\s+(\w+)\s*\(plugins\.Plugin\)', content)
                if class_match:
                    metadata['class_name'] = class_match.group(1)
                
            except Exception as e:
                print(f"Warning: Could not parse metadata from {file_path}: {e}")
            
            return metadata
        
        # Load existing registry
        with open('build/plugin_registry.json', 'r') as f:
            registry = json.load(f)
        
        # Process all Python files in plugins directory
        plugins_dir = Path('plugins')
        for py_file in plugins_dir.glob('*.py'):
            if py_file.name == '__init__.py':
                continue
                
            metadata = extract_plugin_metadata(py_file)
            registry['plugins'].append(metadata)
            print(f"Processed plugin: {metadata['name']} v{metadata['version']}")
        
        # Update registry with current info
        registry['version'] = '${{ steps.version.outputs.VERSION }}'
        registry['generated'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
        registry['plugin_count'] = len(registry['plugins'])
        
        # Save updated registry
        with open('build/plugin_registry.json', 'w') as f:
            json.dump(registry, f, indent=2)
        
        print(f"Generated registry with {len(registry['plugins'])} plugins")
        PYTHON_SCRIPT
    
    - name: Create plugin bundle structure
      run: |
        mkdir -p build/pwnagotchi-plugins-bundle
        
        # Copy all plugin files to bundle directory
        cp -r plugins/* build/pwnagotchi-plugins-bundle/
        
        # Copy metadata file
        cp build/plugin_registry.json build/pwnagotchi-plugins-bundle/
        
        # Create README for the bundle
        BRANCH_INFO=""
        if [ "${{ github.ref_name }}" = "main" ]; then
          BRANCH_INFO="🚀 **Latest Release** - Production ready"
        elif [ "${{ github.ref_name }}" = "rc" ]; then
          BRANCH_INFO="🧪 **Release Candidate** - Testing version"
        else
          BRANCH_INFO="📦 **Tagged Release**"
        fi
        
        cat > build/pwnagotchi-plugins-bundle/README.md << EOF
        # Pwnagotchi Plugins Bundle
        
        $BRANCH_INFO
        
        This bundle contains plugins for Pwnagotchi devices.
        
        ## Installation
        
        To use these plugins with your Pwnagotchi:
        
        1. Add this repository URL to your Pwnagotchi configuration:
           \`\`\`toml
           main.custom_plugin_repos = [
               "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pwnagotchi-plugins-bundle.zip"
           ]
           \`\`\`
        
        2. Update your plugin database:
           \`\`\`bash
           sudo pwnagotchi plugins update
           \`\`\`
        
        3. Install specific plugins:
           \`\`\`bash
           sudo pwnagotchi plugins install <plugin_name>
           \`\`\`
        
        ## Available Plugins
        
        See the \`plugin_registry.json\` file for a complete list of available plugins and their metadata.
        
        ## Build Information
        
        - **Bundle Version**: ${{ steps.version.outputs.VERSION }}
        - **Source Branch**: ${{ github.ref_name }}
        - **Commit**: ${{ github.sha }}
        - **Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        ## Repository
        
        Source: https://github.com/${{ github.repository }}
        Branch: ${{ github.ref_name }}
        EOF
        
        echo "Bundle structure created:"
        find build/pwnagotchi-plugins-bundle -type f | sort
    
    - name: Create simple ZIP bundle
      run: |
        cd build
        
        # Create simple ZIP with just the plugin files (most compatible format)
        cd pwnagotchi-plugins-bundle
        zip -r ../pwnagotchi-plugins.zip *.py *.toml *.yml *.yaml plugin_registry.json 2>/dev/null || true
        cd ..
        
        # Generate checksum
        sha256sum pwnagotchi-plugins.zip > pwnagotchi-plugins.zip.sha256
        
        echo "Generated files:"
        ls -la *.zip *.sha256
    
    - name: Validate ZIP structure
      run: |
        cd build
        
        echo "=== Plugin ZIP Contents ==="
        unzip -l pwnagotchi-plugins.zip
        
        # Validate ZIP structure
        unzip -t pwnagotchi-plugins.zip
        
        echo "ZIP file is valid and ready for Pwnagotchi"
    
    - name: Determine release settings
      id: release_settings
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "RELEASE_NAME=Pwnagotchi Plugins (Latest)" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          echo "RELEASE_TYPE=🚀 **Latest Release** - Always up-to-date plugins" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref_name }}" = "rc" ]; then
          echo "RELEASE_NAME=Pwnagotchi Plugins (Release Candidate)" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          echo "RELEASE_TYPE=🧪 **Release Candidate** - Testing version" >> $GITHUB_OUTPUT
        else
          echo "RELEASE_NAME=Pwnagotchi Plugins Bundle ${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          echo "RELEASE_TYPE=📦 **Tagged Release**" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release
      if: github.event_name != 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Create release body file
        cat > release_body.md << 'EOF'
        # Pwnagotchi Plugins ${{ steps.version.outputs.VERSION }}
        
        ${{ steps.release_settings.outputs.RELEASE_TYPE }}
        
        This release contains Pwnagotchi plugins in the simplest format for maximum compatibility.
        
        ## 📋 Easy Installation (Recommended)
        
        Add this **single line** to your `/etc/pwnagotchi/config.toml`:
        
        ```toml
        main.custom_plugin_repos = [
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pwnagotchi-plugins.zip"
        ]
        ```
        
        Then update your plugins:
        ```bash
        sudo pwnagotchi plugins update
        sudo pwnagotchi plugins list
        sudo pwnagotchi plugins install <plugin_name>
        ```
        
        ## 🔗 Direct Download
        
        **Always Latest**: `https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pwnagotchi-plugins.zip`
        
        ## 📦 What's Included
        
        - **pwnagotchi-plugins.zip** - Simple ZIP with all plugins (recommended)
        - **plugin_registry.json** - Plugin metadata and information
        - **SHA256 checksum** - For file verification
        
        ## 🔧 Build Information
        
        - **Branch**: ${{ github.ref_name }}
        - **Commit**: ${{ github.sha }}
        - **Built**: $(date -u +"%Y-%m-%d %H:%M:%SZ")
        - **Plugins**: $(find plugins -name "*.py" | wc -l) Python plugins included
        EOF
        
        # Delete existing release if it exists (for latest/latest-rc tags)
        if gh release view "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
          echo "Deleting existing release ${{ steps.version.outputs.VERSION }}"
          gh release delete "${{ steps.version.outputs.VERSION }}" --yes --cleanup-tag
        fi
        
        # Create release with assets
        PRERELEASE_FLAG=""
        if [ "${{ steps.release_settings.outputs.IS_PRERELEASE }}" = "true" ]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        
        gh release create "${{ steps.version.outputs.VERSION }}" \
          --title "${{ steps.release_settings.outputs.RELEASE_NAME }}" \
          --notes-file release_body.md \
          $PRERELEASE_FLAG \
          build/pwnagotchi-plugins.zip \
          build/plugin_registry.json \
          build/pwnagotchi-plugins.zip.sha256
    

    
    - name: Output release information
      run: |
        echo "========================================="
        echo "🚀 Pwnagotchi Plugins Release Complete!"
        echo "========================================="
        echo ""
        echo "📦 DIRECT DOWNLOAD URL (Always Latest):"
        echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pwnagotchi-plugins.zip"
        echo ""
        echo "⚙️  PWNAGOTCHI CONFIG (Copy & Paste):"
        echo "main.custom_plugin_repos = ["
        echo "    \"https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pwnagotchi-plugins.zip\""
        echo "]"
        echo ""
        echo "🔧 INSTALLATION COMMANDS:"
        echo "sudo pwnagotchi plugins update"
        echo "sudo pwnagotchi plugins list"
        echo "sudo pwnagotchi plugins install bt-tether"
        echo "sudo pwnagotchi plugins install s3_upload"
        echo ""
        echo "📋 RELEASE INFO:"
        echo "- Tag: ${{ steps.version.outputs.VERSION }}"
        echo "- Branch: ${{ github.ref_name }}"
        echo "- Commit: $(git rev-parse --short HEAD)"
        echo "- Plugins: $(find plugins -name "*.py" | wc -l) available"
        echo "- Format: Simple ZIP (maximum compatibility)"
        echo ""
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "🎯 PRODUCTION READY - Use this URL in your Pwnagotchi!"
        elif [ "${{ github.ref_name }}" = "rc" ]; then
          echo "🧪 TESTING VERSION - Use latest-rc for pre-release testing"
        fi
        echo "========================================="