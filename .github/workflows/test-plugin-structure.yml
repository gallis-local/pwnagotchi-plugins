name: Test Plugin Bundle Structure

on:
  pull_request:
    branches: [ main, rc ]
  push:
    branches: [ main, rc ]

jobs:
  test-plugin-structure:
    runs-on: gallis-gh-runner
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Zip utility
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip
    
    - name: Validate plugins directory structure
      run: |
        echo "Checking plugins directory structure..."
        
        if [ ! -d "plugins" ]; then
          echo "❌ ERROR: plugins directory not found"
          exit 1
        fi
        
        echo "✅ Found plugins directory"
        
        # Check for Python files
        PYTHON_FILES=$(find plugins -name "*.py" | wc -l)
        echo "🐍 Found $PYTHON_FILES Python files"
        
        # Check for config files
        CONFIG_FILES=$(find plugins -name "*.toml" -o -name "*.yml" -o -name "*.yaml" | wc -l)
        echo "⚙️  Found $CONFIG_FILES configuration files"
        
        # List all files for verification
        echo ""
        echo "📋 Plugin directory contents:"
        find plugins -type f | sort
    
    - name: Test plugin metadata extraction
      run: |
        echo "Testing plugin metadata extraction..."
        
        python3 << 'PYTHON_SCRIPT'
        import os
        import re
        from pathlib import Path
        
        def extract_plugin_metadata(file_path):
            """Extract metadata from Python plugin file."""
            metadata = {
                'name': Path(file_path).stem,
                'file': os.path.basename(file_path),
                'version': '1.0.0',
                'author': 'Unknown',
                'license': 'GPL3',
                'description': 'No description available'
            }
            
            try:
                with open(file_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Extract class-level metadata
                patterns = {
                    'version': r'__version__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'author': r'__author__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'license': r'__license__\s*=\s*[\'"]([^\'"]+)[\'"]',
                    'description': r'__description__\s*=\s*[\'"]([^\'"]+)[\'"]'
                }
                
                for key, pattern in patterns.items():
                    match = re.search(pattern, content, re.MULTILINE)
                    if match:
                        metadata[key] = match.group(1)
                
                # Check for Plugin class
                if 'plugins.Plugin' in content:
                    metadata['is_plugin'] = True
                else:
                    metadata['is_plugin'] = False
                    print(f"⚠️  WARNING: {file_path} may not be a valid Pwnagotchi plugin")
                
            except Exception as e:
                print(f"❌ ERROR: Could not parse metadata from {file_path}: {e}")
                return None
            
            return metadata
        
        # Process all Python files in plugins directory
        plugins_dir = Path('plugins')
        valid_plugins = 0
        
        for py_file in plugins_dir.glob('*.py'):
            if py_file.name.startswith('__'):
                continue
                
            print(f"\n🔍 Analyzing {py_file.name}:")
            metadata = extract_plugin_metadata(py_file)
            
            if metadata:
                valid_plugins += 1
                print(f"  ✅ Name: {metadata['name']}")
                print(f"  📦 Version: {metadata['version']}")
                print(f"  👤 Author: {metadata['author']}")
                print(f"  📄 License: {metadata['license']}")
                print(f"  📝 Description: {metadata['description'][:60]}{'...' if len(metadata['description']) > 60 else ''}")
                print(f"  🔌 Valid Plugin: {'Yes' if metadata.get('is_plugin', False) else 'No'}")
        
        print(f"\n📊 Summary: Found {valid_plugins} valid plugins")
        
        if valid_plugins == 0:
            print("❌ ERROR: No valid plugins found")
            exit(1)
        else:
            print("✅ Plugin validation successful")
        PYTHON_SCRIPT
    
    - name: Test ZIP bundle creation
      run: |
        echo "Testing ZIP bundle creation..."
        
        mkdir -p test-build/bundle
        cp -r plugins/* test-build/bundle/ 2>/dev/null || echo "No plugin files to copy"
        
        # Create test registry
        cat > test-build/bundle/test_registry.json << 'EOF'
        {
          "repository": "pwnagotchi-plugins-test",
          "version": "test",
          "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "plugins": []
        }
        EOF
        
        cd test-build
        zip -r test-bundle.zip bundle/
        
        echo "✅ ZIP creation successful"
        echo "📁 Bundle contents:"
        unzip -l test-bundle.zip
        
        # Validate ZIP
        unzip -t test-bundle.zip
        echo "✅ ZIP validation successful"
    
    - name: Generate workflow summary
      run: |
        echo "## Plugin Structure Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Status**: All validations passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Plugin Directory Analysis" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Files**: $(find plugins -name "*.py" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- **Config Files**: $(find plugins -name "*.toml" -o -name "*.yml" -o -name "*.yaml" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Release Information" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "🚀 **Main Branch**: Push to this branch will create a production release" >> $GITHUB_STEP_SUMMARY
          echo "- Release Type: Production (not pre-release)" >> $GITHUB_STEP_SUMMARY
          echo "- Version Format: \`v{date}-main-{commit}\`" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ github.ref_name }}" = "rc" ]; then
          echo "🧪 **RC Branch**: Push to this branch will create a release candidate" >> $GITHUB_STEP_SUMMARY
          echo "- Release Type: Pre-release (testing)" >> $GITHUB_STEP_SUMMARY
          echo "- Version Format: \`v{date}-rc-{commit}\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "📋 **Feature Branch**: No automatic release" >> $GITHUB_STEP_SUMMARY
          echo "- Merge to \`main\` or \`rc\` to trigger release" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Manual Release Options" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to Actions → Release Pwnagotchi Plugins Bundle" >> $GITHUB_STEP_SUMMARY
        echo "2. Run workflow with desired version tag" >> $GITHUB_STEP_SUMMARY
        echo "3. Use generated URL in Pwnagotchi \`custom_plugin_repos\`" >> $GITHUB_STEP_SUMMARY